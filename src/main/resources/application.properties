spring.application.name=Gogobuy

# 資料庫設定 (Aiven MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:defaultdb}?serverTimezone=GMT%2B8&useSSL=true&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 前端與 Session
app.frontend.url=${FRONTEND_URL:https://user.taild8d889.ts.net}
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:gogobuy1041013@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:1089363711944-ol65hqmvt877g40r9hifhtpt9gs8ji03.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Google Gemini API
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent
gemini.api.key=${GEMINI_API_KEY}

# 上傳限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_NAME:danfoowg4}
cloudinary.api-key=${CLOUDINARY_KEY:983535446845449}
cloudinary.api-secret=${CLOUDINARY_SECRET}

# LinePay
